<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Boerenbridge</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #242833;
    --line: #2e3340;
    --text: #e8eaf0;
    --muted: #8b91a1;
    --accent: #f5b301;
    --accent-ink: #1a1400;
    --good: #3ddc84;
    --bad: #ff5c5c;
    --radius: 0.875rem;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  /* alles is in rem, dus de hele app schaalt mee met de schermbreedte (16px bij 375px breed) */
  html { font-size: clamp(13px, 4.27vw, 22px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 1rem calc(1.5rem + env(safe-area-inset-bottom));
    max-width: 35rem; margin: 0 auto;
  }
  h1 { font-size: 1.625rem; margin: 1.25rem 0 0.25rem; }
  h2 { font-size: 0.9375rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 1.5rem 0 0.5rem; }
  p.sub { color: var(--muted); margin: 0 0 1rem; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:disabled { cursor: default; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.875rem; margin-bottom: 0.625rem; }

  .btn { display: block; width: 100%; padding: 1rem; border-radius: var(--radius); font-weight: 700; font-size: 1.0625rem; background: var(--accent); color: var(--accent-ink); margin-top: 0.75rem; }
  .btn:disabled { background: var(--surface-2); color: var(--muted); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 600; }
  .btn.danger { background: var(--bad); color: #fff; }
  .row { display: flex; gap: 0.625rem; }
  .row > * { flex: 1; }

  /* setup */
  .player-input { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
  .player-input input {
    flex: 1; min-width: 0; padding: 0.875rem; border-radius: 0.75rem; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit;
    font-size: max(16px, 1rem); /* onder 16px zoomt iOS in bij het typen */
  }
  .player-input input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .icon-btn { width: 3rem; height: 3rem; border-radius: 0.75rem; background: var(--surface); border: 1px solid var(--line); font-size: 1.125rem; flex: none; }
  .icon-btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 0.875rem; }
  .ok-text { color: var(--good); font-size: 0.875rem; margin: 0.625rem 0 0; }
  .warn-text { color: var(--bad); font-size: 0.9375rem; font-weight: 600; margin: 0.75rem 0 0.625rem; }
  .kv { display: flex; justify-content: space-between; padding: 0.25rem 0; }
  .kv span { color: var(--muted); }
  .choice { padding: 0.875rem 0.625rem; border-radius: 0.75rem; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 0.9375rem; }
  .choice.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .stepper { display: flex; align-items: center; gap: 0.625rem; margin-top: 0.75rem; }
  .stepper b { flex: 1; text-align: center; font-size: 1.375rem; }

  /* kiezen wie deelt */
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip { padding: 0.75rem 1rem; border-radius: 62.4375rem; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* game header */
  .top { display: flex; justify-content: space-between; align-items: center; margin: 1rem 0 0.75rem; }
  .round-no { font-size: 0.875rem; color: var(--muted); }
  .cards-no { font-size: 1.75rem; font-weight: 800; }
  .cards-no small { font-size: 0.9375rem; font-weight: 500; color: var(--muted); }
  .deal { font-size: 0.8125rem; color: var(--muted); }
  .menu-btn { padding: 0.625rem 0.875rem; border-radius: 0.75rem; background: var(--surface); border: 1px solid var(--line); font-size: 0.875rem; }
  .progress { height: 0.25rem; background: var(--surface-2); border-radius: 0.25rem; overflow: hidden; margin-bottom: 0.875rem; }
  .progress > div { height: 100%; background: var(--accent); }
  .phase { display: flex; justify-content: space-between; align-items: baseline; }
  .phase b { font-size: 1.125rem; }
  .sum { font-size: 0.875rem; color: var(--muted); }
  .sum.ok { color: var(--good); }
  .sum.warn { color: var(--bad); }

  /* player entry */
  .p-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.625rem; }
  .p-name { font-weight: 700; font-size: 1.0625rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 0.75rem; font-weight: 700; padding: 0.1875rem 0.5rem; border-radius: 62.4375rem; background: var(--surface-2); color: var(--muted); }
  .badge.dealer { background: var(--accent); color: var(--accent-ink); }
  .badge.starter { background: #2b3a55; color: #9cc0ff; }
  .bid-tag { font-size: 0.8125rem; color: var(--muted); }
  .nums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.375rem; }
  .num {
    height: 3rem; border-radius: 0.625rem; background: var(--surface-2); font-size: 1.1875rem; font-weight: 700;
    transition: transform .05s;
  }
  .num:active { transform: scale(.94); }
  .num.sel { background: var(--accent); color: var(--accent-ink); }
  .num.match { box-shadow: inset 0 0 0 2px var(--muted); }
  .num:disabled { opacity: .25; text-decoration: line-through; }

  /* standings */
  .stand { display: flex; align-items: center; padding: 0.625rem 0; border-bottom: 1px solid var(--line); }
  .stand:last-child { border-bottom: 0; }
  .stand .pos { width: 1.75rem; color: var(--muted); font-weight: 700; }
  .stand .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stand .delta { width: 3.5rem; text-align: right; font-size: 0.875rem; }
  .stand .tot { width: 4rem; text-align: right; font-weight: 800; font-size: 1.125rem; }
  .pos-1 .pos, .pos-1 .tot { color: var(--accent); }
  .plus { color: var(--good); }
  .min { color: var(--bad); }

  /* end */
  .winner { text-align: center; padding: 1.75rem 0.875rem; }
  .winner .trophy { font-size: 3.5rem; }
  .winner .name { font-size: 1.75rem; font-weight: 800; color: var(--accent); margin-top: 0.375rem; }

  /* sheet */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--surface); width: 100%; max-width: 35rem; border-radius: 1.125rem 1.125rem 0 0; padding: 1rem 1rem calc(1.25rem + env(safe-area-inset-bottom)); }
  .sheet p { margin: 0.25rem 0 0.25rem; font-size: 1.0625rem; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>

<script src="minigames.js"></script>
<script>
// ---- regels ----
const MIN_PLAYERS = 2;
const MAX_PLAYERS = 12;
const TOP = 10;         // hoogste ronde als er genoeg kaarten zijn
const TOP_REPEATS = 3;  // de hoogste ronde speel je altijd 3x
const DECK = 52;

// 1, 2 … top-1, top × 3, top-1 … 1
function buildSchedule(top) {
  const up = Array.from({ length: top - 1 }, (_, i) => i + 1);
  return [...up, ...Array(TOP_REPEATS).fill(top), ...up.slice().reverse()];
}

function score(bid, tricks) {
  return bid === tricks ? 10 + 3 * tricks : -3 * Math.abs(bid - tricks);
}

// ---- state ----
const STORE_KEY = 'boerenbridge-v1';
let state = load() || freshSetup(['', '', '', '']);
let sheet = null; // null | 'menu' | 'confirmNew'

function freshSetup(players, deck = DECK) {
  return { screen: 'setup', players, firstDealer: 0, deck, shortage: null };
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
}

const n = () => state.players.length;
const deck = () => state.deck || DECK;
const schedule = () => state.schedule || buildSchedule(TOP);
const roundIdx = () => state.history.length;
const cards = () => schedule()[roundIdx()];
const dealerOf = r => (state.firstDealer + r) % n();
// biedvolgorde: links van de deler begint, deler als laatste
const orderOf = r => Array.from({ length: n() }, (_, i) => (dealerOf(r) + 1 + i) % n());
const totals = () => state.players.map((_, p) => state.history.reduce((s, h) => s + h.scores[p], 0));

// Past de hoogste ronde in het aantal kaarten? Zo niet: extra kaarten of rondes inkorten.
function deckPlan() {
  const need = TOP * n();
  if (need <= deck()) return { ok: true, top: TOP, need };
  if (state.shortage === 'short') return { ok: true, top: Math.floor(deck() / n()), need, short: true };
  return { ok: false, top: TOP, need };
}

const canStart = () => n() >= MIN_PLAYERS && state.players.every(p => p.trim()) && deckPlan().ok;

function newRound() {
  state.cur = { phase: 'bid', bids: Array(n()).fill(null), tricks: Array(n()).fill(null) };
}

function forbiddenBid() {
  const d = dealerOf(roundIdx());
  const others = state.cur.bids.filter((b, p) => p !== d);
  if (others.some(b => b === null)) return null;
  const f = cards() - others.reduce((a, b) => a + b, 0);
  return f >= 0 && f <= cards() ? f : null;
}

// ---- render ----
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const signed = v => (v > 0 ? '+' : '') + v;

function render() {
  save();
  if (state.screen === 'setup') app.innerHTML = setupView();
  else if (state.screen === 'choose') app.innerHTML = chooseView();
  else if (state.screen === 'game') app.innerHTML = gameView();
  else app.innerHTML = endView();
  if (sheet) app.insertAdjacentHTML('beforeend', sheetView());
}

function setupView() {
  const ps = state.players;
  return `
    <h1>Boerenbridge</h1>
    <p class="sub">Vul de spelers in en controleer de kaarten.</p>
    <h2>Spelers (${ps.length})</h2>
    ${ps.map((p, i) => `
      <div class="player-input">
        <input value="${esc(p)}" placeholder="Speler ${i + 1}" data-act="name" data-i="${i}" autocomplete="off" enterkeyhint="next">
        ${ps.length > MIN_PLAYERS ? `<button class="icon-btn" data-act="remove" data-i="${i}" aria-label="Verwijder">✕</button>` : ''}
      </div>`).join('')}
    <p class="hint">Zet de spelers in de volgorde waarin jullie aan tafel zitten.</p>
    ${ps.length < MAX_PLAYERS ? `<button class="btn ghost" data-act="add">+ Speler toevoegen</button>` : ''}

    <h2>Kaarten</h2>
    ${deckView()}

    <button class="btn" data-act="start" ${canStart() ? '' : 'disabled'}>Start spel</button>
  `;
}

function deckView() {
  const plan = deckPlan(), np = n(), d = deck();
  const enough = plan.need <= d;
  const rounds = buildSchedule(plan.top).length;
  const showStepper = state.shortage === 'extra' || d !== DECK;
  return `
    <div class="card">
      <div class="kv"><span>Kaarten in het spel</span><b>${d}</b></div>
      <div class="kv"><span>Nodig voor ronde van ${TOP}</span><b>${np} × ${TOP} = ${plan.need}</b></div>
      ${enough ? '' : `
        <p class="warn-text">Met ${np} spelers kom je ${plan.need - d} kaarten te kort. Wat doen jullie?</p>
        <div class="row">
          <button class="choice ${state.shortage === 'extra' ? 'on' : ''}" data-act="shortage" data-v="extra">Extra kaarten toegevoegd</button>
          <button class="choice ${state.shortage === 'short' ? 'on' : ''}" data-act="shortage" data-v="short">Rondes inkorten</button>
        </div>`}
      ${showStepper ? `
        <div class="stepper">
          <button class="icon-btn" data-act="deck" data-v="-1" aria-label="Minder kaarten">−</button>
          <b>${d}</b>
          <button class="icon-btn" data-act="deck" data-v="1" aria-label="Meer kaarten">+</button>
          <button class="choice" data-act="deck" data-v="52">+52</button>
        </div>` : ''}
      ${plan.ok
        ? `<p class="ok-text">✓ ${rounds} rondes: 1 t/m ${plan.top} kaarten, ${TOP_REPEATS}× ${plan.top}, en terug naar 1.${plan.short ? ' (ingekort)' : ''}</p>`
        : state.shortage === 'extra' ? `<p class="hint" style="margin-top:10px">Zet het aantal kaarten op minimaal ${plan.need}.</p>` : ''}
    </div>`;
}

function chooseView() {
  const chips = role => state.players.map((p, i) => {
    const on = role === 'dealer' ? state.dealerSet && state.firstDealer === i : state.keeper === i;
    return `<button class="chip ${on ? 'on' : ''}" data-act="setRole" data-role="${role}" data-i="${i}">${esc(p)}</button>`;
  }).join('');
  return `
    <h1>Wie deelt er?</h1>
    <p class="sub">Kies zelf of laat een minigame beslissen.</p>
    <h2>Eerste deler</h2>
    <div class="chips">${chips('dealer')}</div>
    <button class="btn ghost" data-act="mini" data-role="dealer">🎲 Minigame: wie gaat delen?</button>
    <h2>Puntenteller (optioneel)</h2>
    <div class="chips">${chips('keeper')}</div>
    <button class="btn ghost" data-act="mini" data-role="keeper">🎲 Minigame: wie houdt de punten bij?</button>
    <button class="btn" data-act="begin" ${state.dealerSet ? '' : 'disabled'}>Start spel</button>
    <button class="btn ghost" data-act="backSetup">Terug</button>
  `;
}

function gameView() {
  const r = roundIdx(), c = cards(), cur = state.cur, d = dealerOf(r), order = orderOf(r);
  const total = schedule().length;
  const isBid = cur.phase === 'bid';
  const values = isBid ? cur.bids : cur.tricks;
  const sum = values.reduce((a, b) => a + (b ?? 0), 0);
  const forbidden = isBid ? forbiddenBid() : null;
  const complete = values.every(v => v !== null);
  const canGo = isBid ? complete && cur.bids[d] !== forbidden : complete && sum === c;

  let sumText, sumCls = '';
  if (isBid) {
    sumText = `Geboden: ${sum} van ${c}` + (sum > c ? ' (overbieding)' : sum < c && complete ? ' (onderbieding)' : '');
  } else {
    sumText = `Slagen: ${sum} / ${c}`;
    sumCls = sum === c ? 'ok' : sum > c ? 'warn' : '';
  }

  return `
    <div class="top">
      <div>
        <div class="round-no">Ronde ${r + 1} van ${total}</div>
        <div class="cards-no">${c} <small>${c === 1 ? 'kaart' : 'kaarten'} p.p.</small></div>
        <div class="deal">Uitdelen: ${n()} × ${c} = ${n() * c} van ${deck()} kaarten</div>
        ${state.keeper != null ? `<div class="deal">✎ ${esc(state.players[state.keeper])} houdt de punten bij</div>` : ''}
      </div>
      <button class="menu-btn" data-act="menu">Menu</button>
    </div>
    <div class="progress"><div style="width:${(r / total) * 100}%"></div></div>

    <div class="phase">
      <b>${isBid ? 'Bieden' : 'Slagen gehaald'}</b>
      <span class="sum ${sumCls}">${sumText}</span>
    </div>
    <div style="height:10px"></div>

    ${state.players.map((name, p) => `
      <div class="card">
        <div class="p-head">
          <span class="p-name">${esc(name)}</span>
          ${!isBid ? `<span class="bid-tag">bod ${cur.bids[p]}</span>` : ''}
          ${p === order[0] ? '<span class="badge starter">begint</span>' : ''}
          ${p === d ? '<span class="badge dealer">deelt</span>' : ''}
        </div>
        <div class="nums">
          ${Array.from({ length: c + 1 }, (_, v) => `
            <button class="num ${values[p] === v ? 'sel' : ''} ${!isBid && cur.bids[p] === v && values[p] !== v ? 'match' : ''}"
              data-act="pick" data-p="${p}" data-v="${v}"
              ${isBid && p === d && v === forbidden ? 'disabled' : ''}>${v}</button>`).join('')}
        </div>
      </div>`).join('')}

    ${isBid
      ? `<button class="btn" data-act="toTricks" ${canGo ? '' : 'disabled'}>Biedingen klaar</button>`
      : `<button class="btn" data-act="finish" ${canGo ? '' : 'disabled'}>${sum === c || !complete ? 'Ronde afronden' : `Totaal moet ${c} zijn`}</button>
         <button class="btn ghost" data-act="toBid">Terug naar bieden</button>`}

    <h2>Stand</h2>
    ${standingsView()}
  `;
}

function standingsView() {
  const t = totals();
  const last = state.history[state.history.length - 1];
  const ranked = state.players.map((name, p) => ({ name, p, tot: t[p] })).sort((a, b) => b.tot - a.tot);
  return `<div class="card">${ranked.map(x => {
    const delta = last ? last.scores[x.p] : null;
    const rank = ranked.findIndex(y => y.tot === x.tot) + 1;
    return `<div class="stand pos-${rank}">
      <span class="pos">${rank}</span>
      <span class="nm">${esc(x.name)}</span>
      <span class="delta ${delta > 0 ? 'plus' : delta < 0 ? 'min' : ''}">${delta === null ? '' : signed(delta)}</span>
      <span class="tot">${x.tot}</span>
    </div>`;
  }).join('')}</div>`;
}

function endView() {
  const t = totals();
  const best = Math.max(...t);
  const winners = state.players.filter((_, p) => t[p] === best);
  return `
    <div class="card winner">
      <div class="trophy">🏆</div>
      <div class="hint">${winners.length > 1 ? 'Gedeelde winst' : 'Winnaar'}</div>
      <div class="name">${winners.map(esc).join(' & ')}</div>
      <div class="hint">${best} punten</div>
    </div>
    <h2>Eindstand</h2>
    ${standingsView()}
    <button class="btn" data-act="rematch">Nog een potje (zelfde spelers)</button>
    <div class="row">
      <button class="btn ghost" data-act="undo">Laatste ronde aanpassen</button>
      <button class="btn ghost" data-act="new">Nieuw spel</button>
    </div>
  `;
}

function sheetView() {
  const body = sheet === 'confirmNew'
    ? `<p>Huidig spel stoppen en een nieuw spel beginnen?</p>
       <p class="hint">De stand van dit spel gaat verloren.</p>
       <button class="btn danger" data-act="newYes">Ja, nieuw spel</button>
       <button class="btn ghost" data-act="close">Annuleren</button>`
    : `${state.history.length ? `<button class="btn ghost" data-act="undo">Vorige ronde aanpassen</button>` : ''}
       <button class="btn ghost" data-act="new">Nieuw spel</button>
       <button class="btn" data-act="close">Sluiten</button>`;
  return `<div class="overlay" data-act="close"><div class="sheet">${body}</div></div>`;
}

// ---- acties ----
app.addEventListener('input', e => {
  if (e.target.dataset.act === 'name') {
    state.players[+e.target.dataset.i] = e.target.value;
    save();
    app.querySelector('[data-act="start"]').disabled = !canStart();
  }
});

app.addEventListener('keydown', e => {
  if (e.target.dataset.act === 'name' && e.key === 'Enter') {
    const next = app.querySelector(`input[data-i="${+e.target.dataset.i + 1}"]`);
    next ? next.focus() : e.target.blur();
  }
});

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'close' && el.classList.contains('overlay') && e.target !== el) return;

  switch (act) {
    case 'add': state.players.push(''); render(); app.querySelector(`input[data-i="${n() - 1}"]`).focus(); return;
    case 'remove':
      state.players.splice(+el.dataset.i, 1);
      state.firstDealer = Math.min(state.firstDealer, n() - 1);
      break;
    case 'shortage': state.shortage = el.dataset.v; break;
    case 'deck': state.deck = Math.max(n(), deck() + +el.dataset.v); break;
    case 'start':
      state.players = state.players.map(p => p.trim());
      state.schedule = buildSchedule(deckPlan().top);
      state.screen = 'choose'; state.dealerSet = false; state.keeper = null;
      break;
    case 'setRole': {
      const i = +el.dataset.i;
      if (el.dataset.role === 'dealer') { state.firstDealer = i; state.dealerSet = true; }
      else state.keeper = state.keeper === i ? null : i;
      break;
    }
    case 'mini': {
      const role = el.dataset.role;
      MiniGames.open({
        players: state.players, stake: role,
        onDone: i => {
          if (role === 'dealer') { state.firstDealer = i; state.dealerSet = true; }
          else state.keeper = i;
          render();
        },
      });
      return;
    }
    case 'begin': state.screen = 'game'; state.history = []; newRound(); break;
    case 'backSetup': state.screen = 'setup'; break;
    case 'pick': {
      const p = +el.dataset.p, v = +el.dataset.v, cur = state.cur;
      const arr = cur.phase === 'bid' ? cur.bids : cur.tricks;
      arr[p] = arr[p] === v ? null : v;
      // als een bod van een ander het bod van de deler ongeldig maakt, wis dat bod
      if (cur.phase === 'bid') {
        const d = dealerOf(roundIdx());
        if (cur.bids[d] !== null && cur.bids[d] === forbiddenBid()) cur.bids[d] = null;
      }
      // alle slagen zijn verdeeld: wie nog niets heeft, heeft er 0 gehaald
      if (cur.phase === 'tricks' && cur.tricks.reduce((a, b) => a + (b ?? 0), 0) === cards()) {
        cur.tricks = cur.tricks.map(t => t ?? 0);
      }
      break;
    }
    case 'toTricks': state.cur.phase = 'tricks'; scrollTo(0, 0); break;
    case 'toBid': state.cur.phase = 'bid'; break;
    case 'finish': {
      const { bids, tricks } = state.cur;
      state.history.push({ cards: cards(), bids, tricks, scores: bids.map((b, p) => score(b, tricks[p])) });
      if (state.history.length === schedule().length) state.screen = 'end';
      else newRound();
      scrollTo(0, 0);
      break;
    }
    case 'undo': {
      const last = state.history.pop();
      state.cur = { phase: 'tricks', bids: last.bids, tricks: last.tricks };
      state.screen = 'game'; sheet = null;
      break;
    }
    case 'new':
      // een afgelopen spel hoeft niet bevestigd te worden
      if (state.screen === 'end') state = freshSetup(state.players, deck());
      else sheet = 'confirmNew';
      break;
    case 'newYes': sheet = null; state = freshSetup(state.players, deck()); scrollTo(0, 0); break;
    case 'rematch':
      state.screen = 'choose'; state.dealerSet = false; state.keeper = null;
      break;
    case 'menu': sheet = 'menu'; break;
    case 'close': sheet = null; break;
    // bv. tikken in een naamveld: niet opnieuw tekenen, anders verdwijnt de focus
    default: return;
  }
  render();
});

render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
